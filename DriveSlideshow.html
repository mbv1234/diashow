<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Diashow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>* { margin:0;padding:0;box-sizing:border-box; } body { background:#0a0a0a;overflow:hidden; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const SLIDE_DURATION   = 6000;
const REFRESH_INTERVAL = 2 * 60 * 1000;
const LS_KEY           = "drive_slideshow_apikey";
const LS_FOLDER        = "drive_slideshow_folder";

function extractFolderId(input) {
  const m = input.match(/folders\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{20,}$/.test(input.trim())) return input.trim();
  return null;
}
function imgUrl(id)  { return `https://lh3.googleusercontent.com/d/${id}=w1920`; }
function imgFall(id) { return `https://drive.google.com/thumbnail?id=${id}&sz=w1920-h1080`; }

// ── Drive API: list images in folder ────────────────────────────────────────
async function fetchImageList(folderId, apiKey) {
  const q      = encodeURIComponent(`'${folderId}' in parents and trashed=false and (mimeType contains 'image/')`);
  const fields  = encodeURIComponent("files(id,name)");
  const url     = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&pageSize=200&key=${apiKey}`;
  const res     = await fetch(url);
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.files || [];
}

function App() {
  const [apiKey,   setApiKey]   = useState(()=> localStorage.getItem(LS_KEY) || "");
  const [url,      setUrl]      = useState(()=> localStorage.getItem(LS_FOLDER) || "");
  const [images,   setImages]   = useState([]);
  const [idx,      setIdx]      = useState(0);
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState("");
  const [started,  setStarted]  = useState(false);
  const [playing,  setPlaying]  = useState(true);
  const [fading,   setFading]   = useState(false);
  const [showUI,   setShowUI]   = useState(true);
  const [progress, setProgress] = useState(0);
  const [isFS,     setIsFS]     = useState(false);
  const [toast,    setToast]    = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [nextRefresh, setNextRefresh] = useState(null);
  const [showKey,  setShowKey]  = useState(false);

  const containerRef = useRef(null);
  const rafRef       = useRef(null);
  const blockRef     = useRef(false); // true during fade transition, prevents double-advance
  const uiTimerRef   = useRef(null);
  const toastTimer   = useRef(null);
  const progStart    = useRef(null);
  const playingRef   = useRef(playing);
  const idxRef       = useRef(idx);
  const imagesRef    = useRef(images);
  const folderIdRef  = useRef(null);
  const apiKeyRef    = useRef(apiKey);
  const refreshTimer = useRef(null);
  const countdownRef = useRef(null);

  useEffect(()=>{ playingRef.current  = playing;  },[playing]);
  useEffect(()=>{ idxRef.current      = idx;      },[idx]);
  useEffect(()=>{ imagesRef.current   = images;   },[images]);
  useEffect(()=>{ apiKeyRef.current   = apiKey;   },[apiKey]);

  const showToast = (msg, type="info") => {
    setToast({msg,type});
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(null), 3500);
  };

  // ── Background refresh ──────────────────────────────────────────────────
  const doRefresh = useCallback(async (silent=true) => {
    const fid = folderIdRef.current;
    const key = apiKeyRef.current;
    if (!fid || !key) return;
    if (!silent) setRefreshing(true);
    try {
      const fresh = await fetchImageList(fid, key);
      if (!fresh.length) { if(!silent) showToast("Ei kuvia löydetty","info"); return; }
      setImages(prev => {
        const existingIds = new Set(prev.map(f=>f.id));
        const newOnes = fresh.filter(f=>!existingIds.has(f.id));
        if (newOnes.length > 0) {
          showToast(`+${newOnes.length} uusi${newOnes.length>1?"a":""} kuva${newOnes.length>1?"a":""}`, "new");
          return [...prev, ...newOnes];
        }
        if (!silent) showToast("Ei uusia kuvia", "info");
        return prev;
      });
    } catch(e) {
      if (!silent) showToast("Päivitys epäonnistui: "+e.message, "err");
    } finally {
      if (!silent) setRefreshing(false);
    }
  },[]);

  const startRefreshCycle = useCallback(()=>{
    clearInterval(refreshTimer.current);
    clearInterval(countdownRef.current);
    let remaining = REFRESH_INTERVAL / 1000;
    setNextRefresh(remaining);
    countdownRef.current = setInterval(()=>{
      remaining -= 1;
      setNextRefresh(remaining);
      if (remaining <= 0) remaining = REFRESH_INTERVAL / 1000;
    }, 1000);
    refreshTimer.current = setInterval(()=>{
      doRefresh(true);
      remaining = REFRESH_INTERVAL / 1000;
      setNextRefresh(remaining);
    }, REFRESH_INTERVAL);
  },[doRefresh]);

  useEffect(()=>{
    if (started) startRefreshCycle();
    return ()=>{ clearInterval(refreshTimer.current); clearInterval(countdownRef.current); };
  },[started, startRefreshCycle]);

  // ── First load ───────────────────────────────────────────────────────────
  const loadImages = async () => {
    if (!apiKey.trim()) { setError("Anna ensin Google API-avain"); return; }
    const fid = extractFolderId(url);
    if (!fid) { setError("Anna kelvollinen Drive-kansion URL tai ID"); return; }
    folderIdRef.current = fid;
    localStorage.setItem(LS_KEY, apiKey.trim());
    localStorage.setItem(LS_FOLDER, url.trim());
    setLoading(true); setError("");
    try {
      const files = await fetchImageList(fid, apiKey.trim());
      if (!files.length) throw new Error("Kansiossa ei ole kuvatiedostoja");
      setImages(files);
      setIdx(0);
      setStarted(true);
    } catch(e) {
      setError("Virhe: " + e.message);
    } finally {
      setLoading(false);
    }
  };

  // ── Navigation ────────────────────────────────────────────────────────────
  const goTo = useCallback((next)=>{
    blockRef.current = true;
    progStart.current = null;
    setFading(true); setProgress(0);
    setTimeout(()=>{ setIdx(next); setFading(false); blockRef.current = false; }, 500);
  },[]);

  const next = useCallback(()=> goTo((idxRef.current+1) % imagesRef.current.length),[goTo]);
  const prev = useCallback(()=> goTo((idxRef.current-1+imagesRef.current.length) % imagesRef.current.length),[goTo]);

  // ── RAF progress loop ─────────────────────────────────────────────────────
  useEffect(()=>{
    if (!started || images.length < 2) return;
    progStart.current = performance.now();
    const tick = ()=>{
      if (!playingRef.current) { rafRef.current = requestAnimationFrame(tick); return; }
      if (!progStart.current) progStart.current = performance.now();
      const elapsed = performance.now() - progStart.current;
      setProgress(Math.min(elapsed/SLIDE_DURATION, 1));
      if (elapsed >= SLIDE_DURATION && !blockRef.current) {
        const n = (idxRef.current+1) % imagesRef.current.length;
        blockRef.current = true;
        setFading(true); setProgress(0); progStart.current = null;
        setTimeout(()=>{ setIdx(n); setFading(false); blockRef.current = false; }, 500);
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return ()=> cancelAnimationFrame(rafRef.current);
  },[started, images.length]);
  useEffect(()=>{ if(playing) progStart.current=null; },[playing]);

  // ── Keyboard ──────────────────────────────────────────────────────────────
  useEffect(()=>{
    const h = e => {
      if (!started) return;
      if (e.key==="ArrowRight") next();
      if (e.key==="ArrowLeft")  prev();
      if (e.key===" ") { e.preventDefault(); setPlaying(p=>!p); }
      if (e.key==="f"||e.key==="F") toggleFS();
      if (e.key==="r"||e.key==="R") doRefresh(false);
    };
    window.addEventListener("keydown",h);
    return ()=> window.removeEventListener("keydown",h);
  },[started,next,prev,doRefresh]);

  // ── Fullscreen ────────────────────────────────────────────────────────────
  const toggleFS = ()=>{
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); setIsFS(true); }
    else { document.exitFullscreen(); setIsFS(false); }
  };
  useEffect(()=>{
    const h = ()=> setIsFS(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange",h);
    return ()=> document.removeEventListener("fullscreenchange",h);
  },[]);

  // ── Auto-hide UI ──────────────────────────────────────────────────────────
  const resetUI = ()=>{
    setShowUI(true);
    clearTimeout(uiTimerRef.current);
    uiTimerRef.current = setTimeout(()=>setShowUI(false), 2800);
  };
  useEffect(()=>{ if(started) resetUI(); },[started]);

  function fmtCountdown(s) {
    if (s==null) return "";
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return `${m}:${String(sec).padStart(2,"0")}`;
  }

  // ─────────────────────────────────────────────────────────────────────────
  // START SCREEN
  // ─────────────────────────────────────────────────────────────────────────
  if (!started) return (
    <div style={{minHeight:"100vh",background:"#0a0a0a",display:"flex",
                 alignItems:"center",justifyContent:"center",padding:"2rem"}}>
      <style>{`
        .sw{width:100%;max-width:460px}
        .st{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.8rem;font-weight:300;
            color:#f0ece4;text-align:center;letter-spacing:.08em;margin-bottom:.3rem}
        .ss{font-family:'DM Mono',monospace;font-size:.62rem;color:#444;text-align:center;
            letter-spacing:.22em;text-transform:uppercase;margin-bottom:2.5rem}
        .label{font-family:'DM Mono',monospace;font-size:.6rem;color:#555;
               letter-spacing:.15em;text-transform:uppercase;margin-bottom:.4rem;display:block}
        .si{width:100%;background:#141414;color:#c8c0b0;border:1px solid #252525;
            border-radius:4px;padding:.9rem 1rem;font-family:'DM Mono',monospace;
            font-size:.73rem;outline:none;transition:border-color .2s;margin-bottom:.9rem}
        .si:focus{border-color:#c8a96e}
        .si::placeholder{color:#333}
        .key-wrap{position:relative}
        .key-eye{position:absolute;right:.8rem;top:50%;transform:translateY(-80%);
                 background:none;border:none;color:#444;cursor:pointer;font-size:.9rem;padding:0}
        .sb{width:100%;background:transparent;border:1px solid #c8a96e;color:#c8a96e;
            font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.2em;
            text-transform:uppercase;padding:.85rem;border-radius:4px;cursor:pointer;
            transition:background .2s,color .2s}
        .sb:hover:not(:disabled){background:#c8a96e;color:#0a0a0a}
        .sb:disabled{opacity:.25;cursor:default}
        .se{font-family:'DM Mono',monospace;font-size:.62rem;color:#b05555;text-align:center;margin-top:.7rem}
        .sh{font-family:'DM Mono',monospace;font-size:.57rem;color:#2a2a2a;text-align:center;margin-top:1.8rem;line-height:2}
        @keyframes spin{to{transform:rotate(360deg)}}
        .spin{display:inline-block;width:11px;height:11px;border:1px solid #c8a96e44;
              border-top-color:#c8a96e;border-radius:50%;animation:spin .8s linear infinite;
              margin-right:7px;vertical-align:middle}
        .divider{border:none;border-top:1px solid #1e1e1e;margin:.8rem 0 1.2rem}
      `}</style>
      <div className="sw">
        <h1 className="st">Diashow</h1>
        <p className="ss">Google Drive · Valokuvat</p>

        <label className="label">Google API-avain</label>
        <div className="key-wrap">
          <input className="si" type={showKey?"text":"password"} value={apiKey}
            onChange={e=>setApiKey(e.target.value)}
            placeholder="AIza..." style={{paddingRight:"2.5rem",marginBottom:".9rem"}} />
          <button className="key-eye" onClick={()=>setShowKey(s=>!s)}>{showKey?"🙈":"👁"}</button>
        </div>

        <hr className="divider"/>

        <label className="label">Drive-kansion linkki</label>
        <input className="si" type="text" value={url}
          onChange={e=>setUrl(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!loading&&loadImages()}
          placeholder="https://drive.google.com/drive/folders/..." />

        {error && <p className="se">{error}</p>}
        <button className="sb" onClick={loadImages} disabled={loading||!url.trim()||!apiKey.trim()}>
          {loading?<><span className="spin"/>Ladataan kuvia…</>:"Käynnistä diashow"}
        </button>
        <p className="sh">API-avain ja kansio muistetaan selaimessa · ← → tauko F koko näyttö R päivitä</p>
      </div>
    </div>
  );

  // ─────────────────────────────────────────────────────────────────────────
  // SLIDESHOW
  // ─────────────────────────────────────────────────────────────────────────
  const cur = images[idx];
  return (
    <div ref={containerRef} onMouseMove={resetUI} onClick={resetUI}
      style={{position:"relative",width:"100vw",height:"100vh",background:"#000",
              overflow:"hidden",cursor:showUI?"default":"none",userSelect:"none"}}>
      <style>{`
        .simg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .5s ease}
        .ui{position:absolute;inset:0;pointer-events:none;transition:opacity .4s ease}
        .tbar{position:absolute;top:0;left:0;right:0;padding:1.4rem 1.8rem 3rem;
              background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
              display:flex;justify-content:space-between;align-items:flex-start;pointer-events:all}
        .fname{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
               font-size:.88rem;font-weight:300;color:rgba(255,255,255,.5);
               max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .tctrls{display:flex;gap:.45rem;align-items:center}
        .cnt{font-family:'DM Mono',monospace;font-size:.58rem;color:rgba(255,255,255,.3);letter-spacing:.15em;margin-right:.3rem}
        .cbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);
              color:rgba(255,255,255,.7);border-radius:4px;width:32px;height:32px;
              display:flex;align-items:center;justify-content:center;cursor:pointer;
              font-size:.8rem;backdrop-filter:blur(4px);transition:background .15s}
        .cbtn:hover{background:rgba(255,255,255,.22)}
        @keyframes spin{to{transform:rotate(360deg)}}
        .spinning{animation:spin .9s linear infinite}
        .abtn{position:absolute;top:50%;transform:translateY(-50%);
              background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);
              color:rgba(255,255,255,.85);width:46px;height:46px;border-radius:50%;
              display:flex;align-items:center;justify-content:center;cursor:pointer;
              font-size:1.4rem;backdrop-filter:blur(4px);
              transition:background .15s,transform .15s;pointer-events:all}
        .abtn:hover{background:rgba(0,0,0,.6);transform:translateY(-50%) scale(1.08)}
        .bbar{position:absolute;bottom:0;left:0;right:0;padding:3rem 2rem 1.4rem;
              background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
              display:flex;flex-direction:column;align-items:center;gap:.75rem;pointer-events:all}
        .dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:80%}
        .dot{border-radius:99px;background:rgba(255,255,255,.28);cursor:pointer;height:5px;transition:all .2s}
        .dot:hover{background:rgba(255,255,255,.55)}
        .ptrack{width:140px;height:1px;background:rgba(255,255,255,.12);border-radius:1px;overflow:hidden}
        .pfill{height:100%;background:rgba(200,169,110,.85);border-radius:1px}
        .rlabel{font-family:'DM Mono',monospace;font-size:.55rem;color:rgba(255,255,255,.22);letter-spacing:.1em}
        .rrow{display:flex;align-items:center;gap:.6rem}
        @keyframes toastIn{from{opacity:0;transform:translateY(8px) translateX(-50%)}to{opacity:1;transform:translateY(0) translateX(-50%)}}
        .toast{position:absolute;top:1.2rem;left:50%;transform:translateX(-50%);
               font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;
               padding:.5rem 1.1rem;border-radius:4px;pointer-events:none;
               animation:toastIn .3s ease;white-space:nowrap;z-index:99}
        .t-new{background:rgba(200,169,110,.18);border:1px solid rgba(200,169,110,.4);color:#c8a96e}
        .t-info{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5)}
        .t-err{background:rgba(180,80,80,.18);border:1px solid rgba(180,80,80,.35);color:#c06060}
      `}</style>

      <img key={idx} src={imgUrl(cur.id)} alt={cur.name}
        className="simg" style={{opacity:fading?0:1}}
        onError={e=>{ e.target.onerror=null; e.target.src=imgFall(cur.id); }} />

      {toast && <div className={`toast t-${toast.type}`}>{toast.msg}</div>}

      <div className="ui" style={{opacity:showUI?1:0}}>
        <div className="tbar">
          <span className="fname">{cur.name}</span>
          <div className="tctrls">
            <span className="cnt">{idx+1} / {images.length}</span>
            <button className="cbtn" onClick={()=>setPlaying(p=>!p)} title="Tauko (välilyönti)">
              {playing?"⏸":"▶"}
            </button>
            <button className={`cbtn${refreshing?" spinning":""}`}
              onClick={()=>doRefresh(false)} title="Päivitä (R)" style={{fontSize:"1rem"}}>
              ↻
            </button>
            <button className="cbtn" onClick={toggleFS} title="Koko näyttö (F)">
              {isFS?"✕":"⛶"}
            </button>
          </div>
        </div>

        <button className="abtn" style={{left:"1.5rem"}} onClick={prev}>‹</button>
        <button className="abtn" style={{right:"1.5rem"}} onClick={next}>›</button>

        <div className="bbar">
          {images.length<=50 &&
            <div className="dots">
              {images.map((_,i)=>(
                <div key={i} className="dot"
                  style={{width:i===idx?"20px":"5px",background:i===idx?"rgba(255,255,255,.9)":undefined}}
                  onClick={()=>goTo(i)} />
              ))}
            </div>}
          <div className="rrow">
            {playing && <div className="ptrack"><div className="pfill" style={{width:`${progress*100}%`,transition:"width .1s linear"}}/></div>}
            {nextRefresh!=null && <span className="rlabel">↻ {fmtCountdown(nextRefresh)}</span>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
